<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BaroFX</title>
<meta name="description" content="BaroFX: a fast, offline-friendly currency converter for Android.">
<style>
  :root { --bg:#F4F5F3; --card:#FFFFFF; --ink:#111614; --muted:#5E6763; --accent:#0B7A55; --border:#E3E6E3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0F1211; --card:#171B19; --ink:#EEF2EF; --muted:#9AA59F; --accent:#3FBF8A; --border:#262C29; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:56px 20px; }
  h1 { margin:0 0 4px; font-size:32px; letter-spacing:-0.02em; } h1 span { color:var(--accent); }
  p { color:var(--muted); margin:0 0 24px; }
  ul { list-style:none; padding:0; margin:0; background:var(--card); border:1px solid var(--border); border-radius:16px; }
  li + li { border-top:1px solid var(--border); }
  a { display:block; padding:14px 18px; color:var(--ink); text-decoration:none; font-weight:600; }
  a:hover { color:var(--accent); }
  footer { margin-top:32px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Baro<span>FX</span></h1>
  <p>A fast, offline-friendly currency converter for Android. 16 currencies, 11 languages.</p>
  <ul>
    <li><a href="https://play.google.com/store/apps/details?id=com.hytiger.barofx">Get it on Google Play</a></li>
    <li><a href="https://hytiger.github.io/barofx-privacy/">Privacy policy / 개인정보처리방침</a></li>
    <li><a href="mailto:hypositive@gmail.com">Contact: hypositive@gmail.com</a></li>
  </ul>
  <footer>Developer site for BaroFX.</footer>
</main>
</body>
</html>
