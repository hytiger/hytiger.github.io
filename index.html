<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hytiger apps</title>
<meta name="description" content="Android apps by hytiger.">
<style>
  :root { --bg:#F4F5F3; --card:#FFFFFF; --ink:#111614; --muted:#5E6763; --accent:#0B7A55; --border:#E3E6E3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0F1211; --card:#171B19; --ink:#EEF2EF; --muted:#9AA59F; --accent:#3FBF8A; --border:#262C29; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:56px 20px; }
  h1 { margin:0 0 4px; font-size:32px; letter-spacing:-0.02em; } h1 span { color:var(--accent); }
  main > p { color:var(--muted); margin:0 0 32px; }
  .app { background:var(--card); border:1px solid var(--border); border-radius:16px; margin:0 0 16px; overflow:hidden; }
  .app header { padding:18px 18px 14px; }
  .app h2 { margin:0; font-size:20px; letter-spacing:-0.01em; }
  .app header p { margin:2px 0 0; color:var(--muted); font-size:15px; }
  .app ul { list-style:none; padding:0; margin:0; border-top:1px solid var(--border); display:flex; }
  .app li { flex:1; } .app li + li { border-left:1px solid var(--border); }
  .app a { display:block; padding:12px 18px; color:var(--ink); text-decoration:none; font-weight:600; font-size:15px; }
  .app a:hover { color:var(--accent); }
  footer { margin-top:32px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>hy<span>tiger</span></h1>
  <p>Small, focused Android apps.</p>

  <!-- To add an app, copy one <section class="app"> block. -->
  <section class="app">
    <header>
      <h2>BaroFX</h2>
      <p>A fast, offline-friendly currency converter. 16 currencies, 11 languages.</p>
    </header>
    <ul>
      <li><a href="https://play.google.com/store/apps/details?id=com.hytiger.barofx">Google Play</a></li>
      <li><a href="https://hytiger.github.io/barofx-privacy/">Privacy / 개인정보처리방침</a></li>
    </ul>
  </section>

  <footer>Developer site for hytiger apps.</footer>
</main>
</body>
</html>
