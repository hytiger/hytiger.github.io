<style>

    --bg: #06111F; --panel: #122338; --text: #F4F8FF; --muted: #ADC2D9;
    --accent: #82DDF8; --line: #29435E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;

  h1 { font-size: 28px; line-height: 1.3; margin: 0 0 8px; }
  .meta { color: var(--muted); font-size: 14px; margin: 0 0 32px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a {
    display: block; padding: 16px 20px; border-radius: 17px;
    background: var(--panel); border: 1px solid var(--line);
    color: var(--accent); text-decoration: none; font-weight: 600;
  }
  a:hover, a:focus-visible { border-color: var(--accent); }
  a span { display: block; color: var(--muted); font-size: 14px; font-weight: 400; }
</style>
